name: Build TWRP for PJA110

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: twrp-pja110-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync minimal TWRP 14.1 source
        working-directory: ${{ runner.temp }}
        run: |
          mkdir twrp
          cd twrp
          "$HOME/bin/repo" init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          "$HOME/bin/repo" sync -c --no-clone-bundle --no-tags -j4

      - name: Add PJA110 device tree
        run: |
          mkdir -p "${{ runner.temp }}/twrp/device/oneplus/pja110"
          rsync -a --delete --exclude='.git/' --exclude='.github/' ./ "${{ runner.temp }}/twrp/device/oneplus/pja110/"

      - name: Apply TWRP 14.1 compatibility patches
        working-directory: ${{ runner.temp }}/twrp
        run: git -C bootable/recovery apply device/oneplus/pja110/patches/*.patch

      - name: Build recovery image
        working-directory: ${{ runner.temp }}/twrp
        env:
          ALLOW_MISSING_DEPENDENCIES: "true"
          USE_CCACHE: "1"
          CCACHE_EXEC: /usr/bin/ccache
        run: |
          source build/envsetup.sh
          lunch twrp_pja110-ap2a-eng
          mka recoveryimage -j4

      - name: Validate image
        run: |
          image="${{ runner.temp }}/twrp/out/target/product/pja110/recovery.img"
          test -f "$image"
          test "$(stat -c %s "$image")" -le 104857600
          sha256sum "$image" | tee twrp-pja110-recovery.sha256
          cp "$image" twrp-pja110-crDroid-Android17-20261118.img

      - uses: actions/upload-artifact@v7
        with:
          name: twrp-pja110-crDroid-Android17-20261118
          path: |
            twrp-pja110-crDroid-Android17-20261118.img
            twrp-pja110-recovery.sha256
          if-no-files-found: error
          retention-days: 14
